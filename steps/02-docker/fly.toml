# fly.toml app configuration file generated for 02-docker-long-sea-2261 on 2025-09-15T21:52:36+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '02-docker-long-sea-2261'
primary_region = 'cdg'

[build]

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[services.http_checks]]
  interval = "10s"
  grace_period = "5s"
  method = "GET"
  path = "/"
  protocol = "http"
  timeout = "3s"
  tls_skip_verify = false